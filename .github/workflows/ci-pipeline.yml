name: DATN Automation Testing Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start SUT with Docker Compose
        run: docker compose up -d --build

      - name: Wait for Backend and Frontend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7053/api/v1/auth/login -X POST -H "Content-Type: application/json" -d '{}' > /dev/null || curl -sf http://localhost:7053/swagger/index.html > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 3
          done
          curl -sf http://localhost:5500/login.html > /dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest requests faker playwright allure-pytest
          playwright install chromium --with-deps

      - name: Run pytest
        env:
          API_BASE_URL: "http://localhost:7053/api/v1"
          WEB_BASE_URL: "http://localhost:5500"
        run: pytest -v -s --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down -v