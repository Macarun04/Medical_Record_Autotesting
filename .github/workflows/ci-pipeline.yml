name: DATN Automation Testing Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies and Playwright
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest requests faker playwright allure-pytest pytest-cov
          playwright install --with-deps chromium

      - name: Start SUT with Docker Compose CI (Branch Coverage Enabled)
        env:
          ENABLE_COVERAGE: "true"
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for SQL Server health-check and seed database
        run: |
          for i in $(seq 1 20); do
            if docker exec ci-sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "StrongPassword123!" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is healthy!"
              break
            fi
            echo "Waiting for SQL Server... ($i/20)"
            sleep 3
          done
          docker exec ci-sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "StrongPassword123!" -C -i /init-db.sql

      - name: Wait for Backend and Frontend health-check
        run: |
          READY=0
          for i in $(seq 1 25); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:7053/api/v1/auth/login -H "Content-Type: application/json" -d '{}' || true)
            if [ "$STATUS" = "400" ] || [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Backend is ready (HTTP $STATUS)!"
              READY=1
              break
            fi
            echo "Waiting for Backend... ($i/25) [HTTP $STATUS]"
            sleep 3
          done
          if [ "$READY" -ne 1 ]; then
            echo "Backend failed to start!"
            docker logs ci-backend || true
            exit 1
          fi
          curl -sf http://localhost:5500/login.html > /dev/null && echo "Frontend is ready!"

      - name: Run full test suite (50 tests)
        env:
          API_BASE_URL: "http://localhost:7053/api/v1"
          WEB_BASE_URL: "http://localhost:5500"
          UI_BASE_URL: "http://localhost:5500"
        run: |
          mkdir -p artifacts/screenshots
          set -o pipefail
          pytest tests -v --alluredir=allure-results 2>&1 | tee artifacts/full-suite.log

      - name: Collect backend branch coverage XML
        if: always()
        run: |
          mkdir -p artifacts
          docker exec ci-backend /tools/dotnet-coverage shutdown sut-cov || true
          docker wait ci-backend || true
          docker cp ci-backend:/coverage/coverage.xml artifacts/coverage.xml || true

      - name: Capture Docker container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose -f docker-compose.ci.yml logs > artifacts/docker-sut.log || true

      - name: Upload CI logs, coverage and Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-artifacts-${{ github.sha }}
          path: |
            allure-results
            artifacts
          retention-days: 14

      - name: Tear down Docker Compose CI
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v