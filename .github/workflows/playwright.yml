name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest # Đây chính là dòng chỉ định GitHub Actions Runner

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện từ requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Cài đặt Playwright Browsers
      run: playwright install --with-deps

    - name: Chạy kịch bản Pytest và tạo dữ liệu Allure
      run: pytest tests/ --alluredir=allure-results
      continue-on-error: true # Đảm bảo test có lỗi (fail) thì vẫn chạy bước lưu báo cáo phía dưới

    - name: Lưu trữ dữ liệu Allure (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results
        retention-days: 10