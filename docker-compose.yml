services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sut-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - ./sut/init-db.sql:/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sut/init-db.sql:/init-db.sql
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P 'StrongPassword123!' -C -i /init-db.sql"]

  backend:
    build:
      context: ./sut/DATN_TestSUT
      dockerfile: Dockerfile
    container_name: sut-backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      ASPNETCORE_URLS: "http://+:7053"
      ConnectionStrings__DefaultConnection: "Server=db;Database=MedicalRecordSystem;User Id=sa;Password=StrongPassword123!;TrustServerCertificate=True;"
    ports:
      - "7053:7053"

  frontend:
    image: nginx:alpine
    container_name: sut-frontend
    depends_on:
      - backend
    volumes:
      - ./sut/SUT_FrontEnd:/usr/share/nginx/html
    ports:
      - "5500:80"
    command: >
      /bin/sh -c "sed -i 's|https://localhost:7053|http://localhost:7053|g' /usr/share/nginx/html/*.js /usr/share/nginx/html/*.html 2>/dev/null || true; nginx -g 'daemon off;'"