[pytest]
# Cấu hình lệnh chạy mặc định (Gộp chung vào đây)
addopts = -v -s --alluredir=allure-results --clean-alluredir
# Danh sách các đánh dấu (markers) bạn đã cấu hình từ trước
markers =
    e2e: Danh dau cac test case End-to-End chay tren giao dien Playwright
    api: Danh dau cac test case goi backend API
    smoke: Danh dau cac test case co ban (Smoke test)
    happy_path: Luong nghiep vu thanh cong
    error_path: Luong nghiep vu that bai / bat loi
    boundary: Kiem thu gia tri bien
    security: Kiem thu bao mat phan quyen